name: Browser regression tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'DPkg::Lock::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-e2e-retries
          for attempt in 1 2 3; do
            if sudo timeout 40s apt-get update && sudo timeout 40s apt-get install -y ffmpeg; then
              exit 0
            fi
            echo "ffmpeg installation attempt $attempt failed"
          done
          exit 1
      - run: ./scripts/setup.sh
      - run: npm ci
      - name: Install Chromium and system dependencies
        timeout-minutes: 5
        run: |
          for attempt in 1 2; do
            if timeout 120s npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Chromium installation attempt $attempt failed"
          done
          exit 1
      - run: npm run smoke
      - run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
